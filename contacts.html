<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <title>Contacts | Flexus open library</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <style>
            body {
                font-family: Arial, sans-serif;
                color: #333;
                background-color: #fff;
                margin: 0;
                padding: 40px 20px;
            }

            .container {
                max-width: 1140px;
                margin: 0 auto;
            }

            h1.text-red {
                color: #d32f2f;
                font-size: 28px;
                margin-bottom: 24px;
                border-bottom: 2px solid #eee;
                padding-bottom: 12px;
            }

            .row {
                display: flex;
                flex-wrap: wrap;
                gap: 30px;
            }

            .col-map {
                flex: 1;
                min-width: 350px;
            }

            .col-info {
                flex: 1;
                min-width: 350px;
            }

            iframe {
                width: 100%;
                height: 600px;
                border: 0;
            }

            .contact-list {
                list-style: none;
                padding: 0;
                margin: 0 0 30px 0;
                line-height: 1.8;
            }

            .contact-list li {
                margin-bottom: 8px;
            }

            .contact-list strong {
                color: #d32f2f;
            }

            .contact-list a {
                color: #0066cc;
                text-decoration: none;
            }

            .contact-list a:hover {
                text-decoration: underline;
            }

            .form-row {
                display: flex;
                gap: 15px;
                margin-bottom: 15px;
            }

            .form-group {
                flex: 1;
                display: flex;
                flex-direction: column;
            }

            .form-group.full-width {
                width: 100%;
            }

            label {
                font-size: 14px;
                color: #555;
                margin-bottom: 5px;
            }

            .form-control {
                padding: 10px 12px;
                border: 1px solid #ccc;
                border-radius: 4px;
                font-size: 14px;
                outline: none;
                transition: border-color 0.2s;
            }

            .form-control:focus {
                border-color: #d32f2f;
            }

            textarea.form-control {
                resize: vertical;
                min-height: 100px;
            }

            .btn-red {
                background-color: #d32f2f;
                color: #fff;
                border: none;
                padding: 12px 24px;
                font-size: 15px;
                font-weight: bold;
                border-radius: 4px;
                cursor: pointer;
                display: inline-flex;
                align-items: center;
                gap: 8px;
                transition: background-color 0.2s;
            }

            .btn-red:hover {
                background-color: #b71c1c;
            }
        </style>
    </head>

    <body class="pages contacts">
        <div class="container">
            <h1 class="text-red">Contacts</h1>

            <div class="row">
                <div class="col-map">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d288.43085591016177!2d-106.53660995729449!3d35.126119229044036!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x87227557938908eb%3A0x723dd3cf63dbb051!2zMzgyOCBQaWVybW9udCBEciBORSwgQWxidXF1ZXJxdWUsIE5NIDg3MTExLCDQodCo0JA!5e0!3m2!1sru!2skz!4v1791832322395!5m2!1sru!2skz" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
                </div>

                <div class="col-info">
                    <ul class="contact-list">
                        <li><strong>Address:</strong> 3828 Piermont Dr NE, Albuquerque, NM 87111, USA</li>
                        <li><strong>Phone:</strong> 555-0179</li>
                        <li><strong>e-mail:</strong> <a href="mailto:bfu@bfu.bg">fol@fol.kz</a></li>
                    </ul>

                    <form id="feedback" action="#" method="post">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="first_name">Name</label>
                                <input type="text" class="form-control" id="first_name" name="first_name" required>
                            </div>
                            <div class="form-group">
                                <label for="email">E-mail</label>
                                <input type="email" class="form-control" id="email" name="email" required>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group full-width">
                                <label for="title">Subject</label>
                                <input type="text" class="form-control" id="title" name="title" required>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group full-width">
                                <label for="comment">Message</label>
                                <textarea name="comment" class="form-control" id="comment" rows="4" required></textarea>
                            </div>
                        </div>

                        <div class="contacts-controls">
                            <button type="submit" name="submit_form" class="btn-red">
                                Send an inquiry <span>&rarr;</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </body>
</html>
